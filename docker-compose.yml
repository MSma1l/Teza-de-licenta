services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_contabil_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_contabil
      POSTGRES_PASSWORD: ai_contabil_pass
      POSTGRES_DB: ai_contabil_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_contabil -d ai_contabil_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_contabil_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend-project
    container_name: ai_contabil_backend
    restart: unless-stopped
    ports:
      - "3777:3777"
    environment:
      DATABASE_URL: postgresql://ai_contabil:ai_contabil_pass@postgres:5432/ai_contabil_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-gtS97WQWlUPkaZMaVUnOAqI4pduj5ItvOftGcE9A_4s-ODrKwTo-XdXdySXxOqs_}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-SHjOWWR7Gr1_uKP5nFrEReKjwyGdRJEfBNOVzOwkXWSr-y5cvS53_rEK9UKoehKj}
      JWT_ALGORITHM: HS256
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 3777
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      UPLOAD_DIR: storage/uploads
      MAX_UPLOAD_SIZE_MB: 10
      ENCRYPTION_KEY_DEFAULT: ${ENCRYPTION_KEY_DEFAULT:-7iHXIqYV3xK7eouRb3UZ+jFD6aqqQ3RLFq87etDofo8=}
      AI_SERVICE_URL: http://ai-service:3778
      DJARVIS_TIMEOUT: "240"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend-project/storage:/app/storage

  ai-service:
    build: ./backend-project/ai-service
    container_name: ai_contabil_ai_service
    restart: unless-stopped
    ports:
      - "3778:3778"
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_contabil:ai_contabil_pass@postgres:5432/ai_contabil_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-gtS97WQWlUPkaZMaVUnOAqI4pduj5ItvOftGcE9A_4s-ODrKwTo-XdXdySXxOqs_}
      JWT_ALGORITHM: HS256
      ENCRYPTION_KEY_DEFAULT: ${ENCRYPTION_KEY_DEFAULT:-7iHXIqYV3xK7eouRb3UZ+jFD6aqqQ3RLFq87etDofo8=}
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 3778
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081,http://localhost:3777}
      MODEL_STORAGE_PATH: /app/model_storage
      TRAINING_DATA_PATH: /app/training_data
      UPLOAD_DIR: /app/storage/uploads
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOG_LEVEL: INFO
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b-instruct
      OLLAMA_TIMEOUT: "120"
      OLLAMA_KEEP_ALIVE: "30m"
      LEGISLATIE_INDEX_DIR: /app/model_storage/legislatie_index
      EMBEDDER_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ai_model_storage:/app/model_storage
      - ai_training_data:/app/training_data
      - ./backend-project/storage:/app/storage
      - ./backend-project/training-data/legislatie:/app/training_data/legislatie:ro

  celery-worker:
    build: ./backend-project/ai-service
    container_name: ai_contabil_celery_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_contabil:ai_contabil_pass@postgres:5432/ai_contabil_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-gtS97WQWlUPkaZMaVUnOAqI4pduj5ItvOftGcE9A_4s-ODrKwTo-XdXdySXxOqs_}
      ENCRYPTION_KEY_DEFAULT: ${ENCRYPTION_KEY_DEFAULT:-7iHXIqYV3xK7eouRb3UZ+jFD6aqqQ3RLFq87etDofo8=}
      MODEL_STORAGE_PATH: /app/model_storage
      TRAINING_DATA_PATH: /app/training_data
      UPLOAD_DIR: /app/storage/uploads
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ai_model_storage:/app/model_storage
      - ai_training_data:/app/training_data
      - ./backend-project/storage:/app/storage

  celery-beat:
    build: ./backend-project/ai-service
    container_name: ai_contabil_celery_beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: ai_contabil_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Fara GPU (CPU-only). Daca ai NVIDIA + nvidia-container-toolkit, adauga:
    #   deploy:
    #     resources:
    #       reservations:
    #         devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes:
  postgres_data:
  redis_data:
  ai_model_storage:
  ai_training_data:
  ollama_models:

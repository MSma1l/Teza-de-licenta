networks:
  ai_contabil_network:
    name: ai_contabil_network
    driver: bridge

services:
  # ==========================================
  #  INFRASTRUCTURA — baza de date + cache
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: ai_contabil_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_contabil
      POSTGRES_PASSWORD: ai_contabil_pass
      POSTGRES_DB: ai_contabil_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_contabil -d ai_contabil_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_contabil_network

  redis:
    image: redis:7-alpine
    container_name: ai_contabil_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_contabil_network

  # ==========================================
  #  BACKEND — API principal FastAPI
  # ==========================================
  backend:
    build: ./backend-project
    container_name: ai_contabil_backend
    restart: unless-stopped
    ports:
      - "3777:3777"
    environment:
      DATABASE_URL: postgresql://ai_contabil:ai_contabil_pass@postgres:5432/ai_contabil_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-gtS97WQWlUPkaZMaVUnOAqI4pduj5ItvOftGcE9A_4s-ODrKwTo-XdXdySXxOqs_}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-SHjOWWR7Gr1_uKP5nFrEReKjwyGdRJEfBNOVzOwkXWSr-y5cvS53_rEK9UKoehKj}
      JWT_ALGORITHM: HS256
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 3777
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081,exp://localhost:8081}
      UPLOAD_DIR: storage/uploads
      MAX_UPLOAD_SIZE_MB: 10
      ENCRYPTION_KEY_DEFAULT: ${ENCRYPTION_KEY_DEFAULT:-7iHXIqYV3xK7eouRb3UZ+jFD6aqqQ3RLFq87etDofo8=}
      AI_SERVICE_URL: http://ai-service:3778
      DJARVIS_TIMEOUT: "240"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend-project/storage:/app/storage
    networks:
      - ai_contabil_network

  # ==========================================
  #  AI SERVICE — OCR, BERT, Djarvis, FAISS
  # ==========================================
  ai-service:
    build: ./backend-project/ai-service
    container_name: ai_contabil_ai_service
    restart: unless-stopped
    ports:
      - "3778:3778"
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_contabil:ai_contabil_pass@postgres:5432/ai_contabil_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-gtS97WQWlUPkaZMaVUnOAqI4pduj5ItvOftGcE9A_4s-ODrKwTo-XdXdySXxOqs_}
      JWT_ALGORITHM: HS256
      ENCRYPTION_KEY_DEFAULT: ${ENCRYPTION_KEY_DEFAULT:-7iHXIqYV3xK7eouRb3UZ+jFD6aqqQ3RLFq87etDofo8=}
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 3778
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081,http://localhost:3777,exp://localhost:8081}
      MODEL_STORAGE_PATH: /app/model_storage
      TRAINING_DATA_PATH: /app/training_data
      UPLOAD_DIR: /app/storage/uploads
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOG_LEVEL: INFO
      OLLAMA_URL: http://ollama:11434
      # 3B incape complet pe RTX 3050 4GB (2 GB VRAM) → all-GPU, ~30 tok/s, cold-load <10s.
      # 7B Q4 nu incape (5+ GB VRAM necesar) si Ollama il sparge GPU/CPU → cold-load 138s
      # si 3 tok/s — adica timeout pe primul request si latenta proasta pe restul.
      OLLAMA_MODEL: qwen2.5:3b-instruct
      OLLAMA_TIMEOUT: "240"
      OLLAMA_KEEP_ALIVE: "30m"
      LEGISLATIE_INDEX_DIR: /app/model_storage/legislatie_index
      EMBEDDER_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ai_model_storage:/app/model_storage
      - ai_training_data:/app/training_data
      - ./backend-project/storage:/app/storage
      - ./backend-project/training-data/legislatie:/app/training_data/legislatie:ro
    networks:
      - ai_contabil_network
    # GPU NVIDIA pentru torch/transformers/PaddleOCR. Codul foloseste deja
    # `torch.cuda.is_available()` deci va comuta automat pe GPU cand e prezent.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  celery-worker:
    build: ./backend-project/ai-service
    container_name: ai_contabil_celery_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_contabil:ai_contabil_pass@postgres:5432/ai_contabil_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-gtS97WQWlUPkaZMaVUnOAqI4pduj5ItvOftGcE9A_4s-ODrKwTo-XdXdySXxOqs_}
      ENCRYPTION_KEY_DEFAULT: ${ENCRYPTION_KEY_DEFAULT:-7iHXIqYV3xK7eouRb3UZ+jFD6aqqQ3RLFq87etDofo8=}
      MODEL_STORAGE_PATH: /app/model_storage
      TRAINING_DATA_PATH: /app/training_data
      UPLOAD_DIR: /app/storage/uploads
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ai_model_storage:/app/model_storage
      - ai_training_data:/app/training_data
      - ./backend-project/storage:/app/storage
    networks:
      - ai_contabil_network
    # GPU pentru OCR + clasificare in background
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  celery-beat:
    build: ./backend-project/ai-service
    container_name: ai_contabil_celery_beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai_contabil_network

  ollama:
    image: ollama/ollama:latest
    container_name: ai_contabil_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      # Lasam Ollama sa decida cate layere pune pe GPU (RTX 3050 4GB).
      # Pentru qwen2.5:3b Q4 → toate layerele incap pe GPU (~2 GB VRAM).
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_FLASH_ATTENTION: "1"
    networks:
      - ai_contabil_network
    # === GPU NVIDIA ===
    # Necesita pe host: NVIDIA driver + nvidia-container-toolkit
    #   (pe Windows: WSL2 + Docker Desktop cu GPU acceleration ON)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot: pull-uieste modelul Djarvis la prima pornire si iese.
  ollama-bootstrap:
    image: ollama/ollama:latest
    container_name: ai_contabil_ollama_bootstrap
    depends_on:
      - ollama
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Astept Ollama..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "Pull qwen2.5:3b-instruct (Djarvis)..."
        ollama pull qwen2.5:3b-instruct
        echo "Gata."
    restart: "no"
    networks:
      - ai_contabil_network

  # ==========================================
  #  FRONTEND WEB — React + Vite
  # ==========================================
  frontend:
    build:
      context: ./frontend-web-aplication/AI-Contabil
      dockerfile: Dockerfile
    container_name: ai_contabil_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-web-aplication/AI-Contabil:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:3777/api/v1/ac
      VITE_AI_SERVICE_URL: http://localhost:3778/api/v1
    depends_on:
      - backend
    networks:
      - ai_contabil_network

  # ==========================================
  #  FRONTEND MOBILE — React Native + Expo
  # ==========================================
  mobile:
    build:
      context: ./frontend-mobile-aplication
      dockerfile: Dockerfile
    container_name: ai_contabil_mobile
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./frontend-mobile-aplication:/app
      - /app/node_modules
    environment:
      # IMPORTANT: pe ${LAN_IP} trebuie sa raspunda backend-ul, nu localhost.
      # Telefonul nu vede "localhost" al laptopului — trebuie IP-ul WiFi al PC-ului.
      EXPO_PUBLIC_API_URL: http://${LAN_IP:-localhost}:3777/api/v1/ac
      EXPO_PUBLIC_AI_SERVICE_URL: http://${LAN_IP:-localhost}:3778/api/v1
      # Hostname pe care Expo Metro il anunta in QR code — TREBUIE sa fie IP-ul
      # WiFi al laptopului tau (ex: 192.168.1.20). Pune-l in .env: LAN_IP=192.168.x.y
      REACT_NATIVE_PACKAGER_HOSTNAME: ${LAN_IP:-}
      # Mod implicit: lan. Pune EXPO_DEV_MODE=tunnel daca telefonul e pe alta retea.
      EXPO_DEV_MODE: ${EXPO_DEV_MODE:-lan}
    depends_on:
      - backend
    networks:
      - ai_contabil_network
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data:
  ai_model_storage:
  ai_training_data:
  ollama_models:

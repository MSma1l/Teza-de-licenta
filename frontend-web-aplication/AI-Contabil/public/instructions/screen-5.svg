<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <radialGradient id="checkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="successGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#065f46" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowCheck" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg5)"/>

  <!-- Confetti dots -->
  <g opacity="0.6">
    <circle cx="180" cy="120" r="6" fill="#10b981"/>
    <circle cx="320" cy="180" r="4" fill="#4f46e5"/>
    <circle cx="1380" cy="140" r="6" fill="#f59e0b"/>
    <circle cx="1480" cy="220" r="5" fill="#10b981"/>
    <rect x="240" y="240" width="8" height="8" fill="#4f46e5" transform="rotate(45 244 244)"/>
    <rect x="1320" y="320" width="10" height="10" fill="#ec4899" transform="rotate(30 1325 325)"/>
    <circle cx="120" cy="780" r="5" fill="#4f46e5"/>
    <circle cx="1500" cy="780" r="6" fill="#f59e0b"/>
    <rect x="280" y="700" width="8" height="8" fill="#10b981" transform="rotate(60 284 704)"/>
    <rect x="1380" y="680" width="9" height="9" fill="#4f46e5" transform="rotate(20 1385 685)"/>
    <circle cx="80" cy="450" r="4" fill="#ec4899"/>
    <circle cx="1540" cy="490" r="4" fill="#10b981"/>
  </g>

  <!-- Success circle glow -->
  <circle cx="800" cy="290" r="220" fill="url(#checkGlow)"/>

  <!-- Big checkmark circle -->
  <g filter="url(#shadowCheck)">
    <circle cx="800" cy="290" r="120" fill="url(#successGrad)"/>
  </g>
  <path d="M 745 290 L 785 330 L 860 250" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Title -->
  <text x="800" y="475" font-size="44" font-weight="800" fill="#0f172a" text-anchor="middle">Cererea a fost trimisa cu succes!</text>
  <text x="800" y="515" font-size="18" fill="#475569" text-anchor="middle">Vei primi confirmare prin email · poti vedea actul oricand in sectiunea Documente</text>

  <!-- Confirmation card -->
  <g filter="url(#shadow5)">
    <rect x="380" y="560" width="840" height="240" rx="20" fill="#ffffff" stroke="#d1fae5" stroke-width="2"/>
  </g>

  <!-- Card header -->
  <rect x="380" y="560" width="840" height="58" rx="20" fill="#f0fdf4"/>
  <rect x="380" y="600" width="840" height="18" fill="#f0fdf4"/>
  <text x="410" y="595" font-size="14" font-weight="700" fill="#065f46" letter-spacing="1">DETALII CERERE</text>
  <rect x="1090" y="578" width="105" height="24" rx="12" fill="#10b981"/>
  <text x="1142" y="594" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">IN PROCESARE</text>

  <!-- Card content - 4 columns -->
  <g font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">
    <text x="410" y="658">NUMAR CERERE</text>
    <text x="660" y="658">DOCUMENT</text>
    <text x="910" y="658">PROGRAMARE</text>
    <text x="1150" y="658">CLIENT</text>
  </g>

  <g font-size="16" font-weight="700" fill="#0f172a">
    <text x="410" y="688">#AC-2026-0142</text>
    <text x="660" y="688">Factura FA-0142</text>
    <text x="910" y="688">22.05.2026 · 10:00</text>
    <text x="1150" y="688">Beta Trade SRL</text>
  </g>

  <g font-size="12" fill="#64748b">
    <text x="410" y="708">trimis 18.05.2026 16:42</text>
    <text x="660" y="708">PDF · 1 pagina · 142 KB</text>
    <text x="910" y="708">IFS Chisinau, bd. SCM 162</text>
    <text x="1150" y="708">IDNO 1003600123456</text>
  </g>

  <!-- Card footer divider -->
  <line x1="410" y1="735" x2="1190" y2="735" stroke="#f1f5f9"/>

  <!-- Card footer info -->
  <circle cx="425" cy="772" r="8" fill="#4f46e5"/>
  <path d="M 425 768 L 425 776 M 425 765 L 425 765" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="445" y="777" font-size="13" fill="#475569">Reminder: <tspan font-weight="700" fill="#0f172a">adu actul tiparit + buletinul</tspan> la programare</text>

  <!-- Action buttons -->
  <rect x="555" y="830" width="220" height="56" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="665" y="864" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">Inapoi acasa</text>

  <rect x="795" y="830" width="250" height="56" rx="28" fill="#4f46e5"/>
  <text x="920" y="864" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Vezi documentul  →</text>
</svg>

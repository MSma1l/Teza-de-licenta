<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="aiBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.1"/>
    </filter>
    <filter id="shadowPhone" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#1e1b4b" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)"/>

  <!-- Header -->
  <text x="80" y="85" font-size="32" font-weight="700" fill="#0f172a">Completeaza datele · Factura</text>
  <text x="80" y="118" font-size="16" fill="#64748b">Scrie un prompt si AI-ul completeaza, sau scaneaza documentul cu telefonul</text>

  <!-- AI prompt bar -->
  <g filter="url(#shadow2)">
    <rect x="80" y="150" width="920" height="76" rx="14" fill="url(#aiBar)" stroke="#c7d2fe" stroke-width="2"/>
  </g>
  <text x="100" y="180" font-size="14" font-weight="700" fill="#3730a3">✨ COMPLETARE AUTOMATA CU AI</text>
  <text x="100" y="200" font-size="11" fill="#6366f1">Djarvis · local · fara internet</text>
  <rect x="100" y="208" width="640" height="0" stroke="#c7d2fe"/>
  <rect x="380" y="170" width="450" height="40" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="395" y="195" font-size="14" fill="#475569">factura catre Beta Trade SRL pe 5000 MDL servicii IT</text>
  <rect x="845" y="170" width="140" height="40" rx="10" fill="#4f46e5"/>
  <text x="915" y="195" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">✨ Genereaza</text>

  <!-- Form fields -->
  <text x="80" y="280" font-size="13" font-weight="700" fill="#475569">DETALII FURNIZOR</text>
  <g filter="url(#shadow2)"><rect x="80" y="295" width="450" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <text x="100" y="313" font-size="11" fill="#94a3b8">Denumire</text>
  <text x="100" y="334" font-size="15" font-weight="600" fill="#0f172a">Compania Mea SRL</text>
  <g filter="url(#shadow2)"><rect x="550" y="295" width="450" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
  <text x="570" y="313" font-size="11" fill="#94a3b8">IDNO</text>
  <text x="570" y="334" font-size="15" font-weight="600" fill="#0f172a">1010600000000</text>

  <text x="80" y="385" font-size="13" font-weight="700" fill="#475569">DETALII CUMPARATOR</text>
  <g filter="url(#shadow2)"><rect x="80" y="400" width="450" height="52" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/></g>
  <text x="100" y="418" font-size="11" fill="#4f46e5">Denumire · completat de AI</text>
  <text x="100" y="439" font-size="15" font-weight="600" fill="#0f172a">Beta Trade SRL</text>
  <g filter="url(#shadow2)"><rect x="550" y="400" width="450" height="52" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/></g>
  <text x="570" y="418" font-size="11" fill="#4f46e5">IDNO · completat de AI</text>
  <text x="570" y="439" font-size="15" font-weight="600" fill="#0f172a">1003600123456</text>

  <text x="80" y="490" font-size="13" font-weight="700" fill="#475569">ARTICOLE</text>
  <g filter="url(#shadow2)"><rect x="80" y="505" width="920" height="64" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/></g>
  <text x="100" y="528" font-size="11" fill="#4f46e5">Denumire</text>
  <text x="100" y="552" font-size="14" fill="#0f172a">Servicii consultanta IT</text>
  <text x="620" y="528" font-size="11" fill="#94a3b8">Cantitate</text>
  <text x="620" y="552" font-size="14" fill="#0f172a">1</text>
  <text x="720" y="528" font-size="11" fill="#94a3b8">Pret unitar</text>
  <text x="720" y="552" font-size="14" fill="#0f172a">5,000 MDL</text>
  <text x="870" y="528" font-size="11" fill="#94a3b8">TVA</text>
  <text x="870" y="552" font-size="14" fill="#0f172a">20%</text>

  <!-- Totals -->
  <text x="80" y="615" font-size="15" fill="#64748b">Subtotal: <tspan font-weight="600" fill="#0f172a">5,000.00 MDL</tspan></text>
  <text x="80" y="640" font-size="15" fill="#64748b">TVA 20%: <tspan font-weight="600" fill="#0f172a">1,000.00 MDL</tspan></text>
  <text x="80" y="668" font-size="20" font-weight="800" fill="#4f46e5">TOTAL: 6,000.00 MDL</text>

  <!-- Phone mockup right side -->
  <g filter="url(#shadowPhone)">
    <rect x="1110" y="180" width="340" height="640" rx="44" fill="url(#phoneGrad)"/>
  </g>
  <rect x="1130" y="200" width="300" height="600" rx="28" fill="#0f172a"/>
  <!-- Notch -->
  <rect x="1240" y="200" width="80" height="22" rx="11" fill="#1e1b4b"/>

  <!-- Phone screen content: scan camera -->
  <rect x="1150" y="240" width="260" height="540" rx="14" fill="#1e293b"/>
  <text x="1280" y="278" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Scaneaza documentul</text>

  <!-- Camera viewfinder corners -->
  <g stroke="#a78bfa" stroke-width="3" fill="none">
    <path d="M 1180 320 L 1180 300 L 1200 300"/>
    <path d="M 1360 300 L 1380 300 L 1380 320"/>
    <path d="M 1180 700 L 1180 720 L 1200 720"/>
    <path d="M 1360 720 L 1380 720 L 1380 700"/>
  </g>

  <!-- Document mock inside viewfinder -->
  <rect x="1200" y="340" width="160" height="220" rx="6" fill="#ffffff" opacity="0.95"/>
  <text x="1280" y="365" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">FACTURA FISCALA</text>
  <line x1="1210" y1="378" x2="1350" y2="378" stroke="#cbd5e1"/>
  <line x1="1210" y1="395" x2="1320" y2="395" stroke="#cbd5e1"/>
  <line x1="1210" y1="410" x2="1340" y2="410" stroke="#cbd5e1"/>
  <line x1="1210" y1="425" x2="1300" y2="425" stroke="#cbd5e1"/>
  <line x1="1210" y1="450" x2="1350" y2="450" stroke="#cbd5e1"/>
  <line x1="1210" y1="465" x2="1330" y2="465" stroke="#cbd5e1"/>
  <line x1="1210" y1="480" x2="1320" y2="480" stroke="#cbd5e1"/>
  <line x1="1210" y1="510" x2="1350" y2="510" stroke="#cbd5e1"/>
  <line x1="1210" y1="525" x2="1290" y2="525" stroke="#cbd5e1"/>
  <line x1="1210" y1="540" x2="1340" y2="540" stroke="#cbd5e1"/>

  <!-- AI detection overlay -->
  <rect x="1210" y="442" width="130" height="20" rx="3" fill="none" stroke="#10b981" stroke-width="2"/>
  <circle cx="1346" cy="452" r="8" fill="#10b981"/>
  <path d="M 1342 452 L 1345 455 L 1351 449" stroke="#ffffff" stroke-width="2" fill="none"/>

  <!-- Capture button -->
  <circle cx="1280" cy="740" r="32" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="1280" cy="740" r="24" fill="#ffffff"/>

  <!-- Status pill -->
  <rect x="1180" y="620" width="200" height="36" rx="18" fill="#4f46e5"/>
  <circle cx="1200" cy="638" r="6" fill="#a78bfa">
    <animate attributeName="r" values="6;9;6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="1285" y="643" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Detectare automata...</text>
</svg>
